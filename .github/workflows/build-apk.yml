name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      api_base_url:
        description: 'Backend API URL (VD: https://alexhuy.tail2e0dc9.ts.net/api)'
        required: true
        default: 'https://alexhuy.tail2e0dc9.ts.net/api'
  push:
    branches:
      - main
    paths:
      - 'flutter_app/**'
      - '.github/workflows/build-apk.yml'

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: 'stable'
          cache: true

      - name: Resolve API Base URL
        id: api
        run: |
          URL="${{ github.event.inputs.api_base_url }}"
          if [ -z "$URL" ]; then
            URL="https://alexhuy.tail2e0dc9.ts.net/api"
          fi
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: Install Flutter dependencies
        working-directory: flutter_app
        run: flutter pub get

      - name: Build Android Release APK
        working-directory: flutter_app
        run: flutter build apk --release --dart-define=API_BASE_URL=${{ steps.api.outputs.url }}

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: minilab-customer-apk
          path: flutter_app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
