<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta content="width=device-width, initial-scale=1.0" name="viewport">
  <title>Đăng nhập Film Lab - MiniLab</title>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "primary": "#8a3a03",
            "primary-container": "#a9511c",
            "on-primary": "#ffffff",
            "on-primary-container": "#ffe6dc",
            "secondary": "#446557",
            "secondary-container": "#c6ebd9",
            "on-secondary-container": "#4a6b5d",
            "surface": "#fff8f3",
            "surface-container": "#f4ede6",
            "surface-container-low": "#faf2eb",
            "surface-container-lowest": "#ffffff",
            "surface-container-high": "#efe7e0",
            "surface-variant": "#e9e1da",
            "on-surface": "#1e1b17",
            "on-surface-variant": "#55433a",
            "outline": "#887268",
            "outline-variant": "#dcc1b5",
            "error": "#ba1a1a",
            "error-container": "#ffdad6",
            "on-error-container": "#93000a"
          },
          fontFamily: {
            "headline-xl": ["IBM Plex Sans"],
            "headline-lg": ["IBM Plex Sans"],
            "headline-md": ["IBM Plex Sans"],
            "headline-sm": ["IBM Plex Sans"],
            "body-md": ["IBM Plex Sans"],
            "body-sm": ["IBM Plex Sans"],
            "label-md": ["IBM Plex Mono"],
            "label-sm": ["IBM Plex Mono"],
            "code-md": ["IBM Plex Mono"]
          }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="css/impeccable.css">
</head>
<body class="bg-surface font-body-md text-on-surface antialiased">
<main class="min-h-screen w-full flex items-center justify-center p-6 bg-surface-container-low">
  <div class="flex flex-col w-full">
    <div class="w-full flex items-center justify-center py-6 px-4">
      <div class="w-full max-w-[520px] bg-surface-container-lowest rounded-xl shadow-xl flex flex-col overflow-hidden relative">
        <!-- Top Subtle Indicator Strip -->
        <div class="w-full h-1 bg-gradient-to-r from-primary-container via-primary to-secondary"></div>
        
        <!-- Header & Brand Identification -->
        <div class="p-8 pb-0 flex flex-col items-center text-center">
          <div class="flex items-center gap-2 mb-4">
            <div class="flex items-center gap-1 bg-surface-container px-3 py-1 rounded-full">
              <span class="material-symbols-outlined text-primary text-[1.125rem]" style="font-variation-settings: 'FILL' 1;">camera_roll</span>
              <span class="font-headline-sm uppercase tracking-wider text-on-surface text-xs font-bold">MINILAB ARCHIVE</span>
            </div>
            <span class="bg-surface-variant text-on-surface-variant font-label-sm text-xs px-2.5 py-1 rounded-full uppercase tracking-wider">
              LAB OPS / PHÂN HỆ TIỆM LAB
            </span>
          </div>
          <h1 class="font-headline-xl text-2xl font-bold text-on-surface tracking-tight mb-1">Đăng nhập Film Lab</h1>
          <p class="font-body-sm text-xs text-on-surface-variant max-w-sm">
            Hệ thống quản lý tiếp nhận & xử lý cuộn phim analog chuẩn hóa
          </p>
        </div>

        <div id="login-alert" class="hidden mx-8 mt-4 p-3 rounded-lg bg-error-container text-on-error-container text-xs flex items-center gap-2">
          <span class="material-symbols-outlined text-[1rem]">error</span>
          <span id="alert-msg">Thông tin đăng nhập không hợp lệ</span>
        </div>

        <!-- Main Operational Form Card -->
        <form class="p-8 pt-4 flex flex-col gap-4" id="lab-login-form" onsubmit="event.preventDefault(); handleShiftLogin();">
          <!-- Operator ID / Email Field -->
          <div class="flex flex-col gap-1 text-left">
            <label class="font-label-sm text-xs text-on-surface-variant uppercase tracking-wider font-semibold" for="operator-id">Email / Mã tài khoản tiệm</label>
            <div class="relative flex items-center">
              <span class="material-symbols-outlined absolute left-3 text-on-surface-variant text-[1.125rem]">mail</span>
              <input class="w-full bg-surface-container-lowest text-on-surface font-body-md text-sm pl-10 pr-4 py-2 border border-outline-variant/60 rounded-lg focus:outline-none focus:ring-1 focus:ring-primary shadow-sm" id="operator-id" placeholder="lab@saigonfilm.vn hoặc LAB-01" required="" type="text" value="lab@saigonfilm.vn">
            </div>
          </div>

          <!-- Secure Password Input -->
          <div class="flex flex-col gap-1 text-left">
            <div class="flex justify-between items-center">
              <label class="font-label-sm text-xs text-on-surface-variant uppercase tracking-wider font-semibold" for="operator-password">
                MẬT KHẨU BẢO MẬT
              </label>
              <a class="font-label-sm text-xs text-primary hover:underline" href="javascript:void(0)">
                Quên mật khẩu?
              </a>
            </div>
            <div class="relative flex items-center">
              <span class="material-symbols-outlined absolute left-3 text-on-surface-variant text-[1.125rem]">lock</span>
              <input class="w-full bg-surface-container-lowest text-on-surface font-code-md text-sm pl-10 pr-10 py-2 border border-outline-variant/60 rounded-lg focus:outline-none focus:ring-1 focus:ring-primary shadow-sm" id="operator-password" placeholder="••••••••••••" required="" type="password" value="LabArchive@2024">
              <button class="absolute right-3 text-on-surface-variant hover:text-on-surface flex items-center justify-center p-1 rounded focus:outline-none" id="toggle-pwd-btn" onclick="togglePasswordVisibility()" title="Hiện/Ẩn mật khẩu" type="button">
                <span class="material-symbols-outlined text-[1.125rem]" id="pwd-icon">visibility_off</span>
              </button>
            </div>
          </div>

          <!-- Branch Selector -->
          <div class="flex flex-col gap-1 text-left">
            <label class="font-label-sm text-xs text-on-surface-variant uppercase tracking-wider font-semibold" for="lab-branch">Chi nhánh tiệm</label>
            <div class="relative flex items-center">
              <span class="material-symbols-outlined absolute left-3 text-on-surface-variant text-[1.125rem]">storefront</span>
              <select class="w-full bg-surface-container-lowest text-on-surface font-body-sm text-sm pl-10 pr-10 py-2 border border-outline-variant/60 rounded-lg appearance-none focus:outline-none focus:ring-1 focus:ring-primary shadow-sm cursor-pointer" id="lab-branch">
                <option selected="" value="sgn-01">Chi nhánh 01 - Quận 3, TP.HCM (Lab Trung Tâm)</option>
                <option value="sgn-02">Chi nhánh 02 - Thảo Điền, TP.Thủ Đức (Lab Scan Tốc Độ)</option>
                <option value="han-01">Chi nhánh 03 - Hoàn Kiếm, Hà Nội (Trạm Nhận)</option>
              </select>
              <span class="material-symbols-outlined pointer-events-none absolute right-3 text-on-surface-variant text-[1.125rem]">expand_more</span>
            </div>
          </div>

          <!-- Primary Action Trigger -->
          <button class="w-full bg-primary-container hover:bg-primary text-on-primary py-2.5 px-4 rounded-lg font-headline-md text-sm font-bold flex items-center justify-center gap-2 shadow-md transition-all active:scale-[0.99] cursor-pointer mt-2" id="btn-submit" type="submit">
            <span class="material-symbols-outlined text-[1.25rem]">login</span>
            <span>Đăng nhập</span>
          </button>
        </form>

        <!-- Bottom System Footer & Register Prompt -->
        <div class="bg-surface-container p-6 pt-4 flex flex-col gap-2 text-center">
          <div class="flex items-center justify-center gap-2 font-body-sm text-xs text-on-surface-variant">
            <span>Chưa có tài khoản tiệm?</span>
            <a class="font-headline-sm font-bold text-primary hover:underline flex items-center gap-1" href="web_lab_01.html">
              Đăng ký mở tiệm Lab
              <span class="material-symbols-outlined text-[0.875rem]">arrow_forward</span>
            </a>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    function togglePasswordVisibility() {
      const passwordInput = document.getElementById('operator-password');
      const pwdIcon = document.getElementById('pwd-icon');
      if (passwordInput.type === 'password') {
        passwordInput.type = 'text';
        pwdIcon.textContent = 'visibility';
      } else {
        passwordInput.type = 'password';
        pwdIcon.textContent = 'visibility_off';
      }
    }

    async function handleShiftLogin() {
      const submitBtn = document.getElementById('btn-submit');
      const email = document.getElementById('operator-id').value;
      const password = document.getElementById('operator-password').value;
      const branchId = document.getElementById('lab-branch').value;
      const alertBox = document.getElementById('login-alert');

      alertBox.classList.add('hidden');
      submitBtn.innerHTML = `
        <span class="material-symbols-outlined animate-spin text-[1.25rem]">sync</span>
        <span>Đang kích hoạt trạm làm việc...</span>
      `;
      submitBtn.disabled = true;

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password, branch_id: branchId })
        });
        const data = await res.json();

        if (data.success) {
          localStorage.setItem('minilab_token', data.data.token);
          localStorage.setItem('minilab_user', JSON.stringify(data.data.user));
          
          submitBtn.innerHTML = `
            <span class="material-symbols-outlined text-[1.25rem]">check_circle</span>
            <span>Đã kết nối thành công!</span>
          `;
          submitBtn.classList.remove('bg-primary-container');
          submitBtn.classList.add('bg-secondary');

          setTimeout(() => {
            window.location.href = 'web_lab_03.html';
          }, 600);
        } else {
          throw new Error(data.message || 'Lỗi đăng nhập');
        }
      } catch (err) {
        alertBox.classList.remove('hidden');
        document.getElementById('alert-msg').textContent = err.message || 'Lỗi kết nối máy chủ';
        submitBtn.innerHTML = `<span class="material-symbols-outlined text-[1.25rem]">login</span><span>Đăng nhập</span>`;
        submitBtn.disabled = false;
      }
    }
  </script>
</main>
</body>
</html>
