ull pt-safe pb-safe bg-surface" style="background-color: rgb(250, 248, 244);"><div class="flex flex-col w-full pb-8 px-4"><!-- Brand Header: Minimalist Icon + MiniLab + Description -->

      </div>
    </div>

    <!-- Password field -->
    <div class="flex flex-col gap-1.5">
      <div class="flex items-center justify-between">
        <label class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-wider" for="password">Mật khẩu</label>

        <button aria-label="Hiện mật khẩu" class="text-on-surface-variant hover:text-on-surface p-0.5 flex items-center justify-center focus:outline-none" id="togglePasswordBtn" onclick="togglePassword()" type="button">

        <path d="M12 23c3.2 0 6-1.1 8-3l-3.7-2.9c-1.1.7-2.5 1.2-4.3 1.2-3 0-5.5-2-6.4-4.8L1.9 16.4C3.7 20.1 7.5 23 12 23z" fill="#34A853"></path>

      Đăng ký ngay
    </a>
  </p>
</div></div>
<script>
  // Simple micro-interactions: Slider pagination & Password visibility
  let currentSlide = 0;
  const slides = document.querySelectorAll('.carousel-slide');
  const dots = document.querySelectorAll('.indicator-dot');

  function goToSlide(index) {
    if (index === currentSlide) return;
    slides[currentSlide].classList.add('hidden');
    dots[currentSlide].classList.remove('w-5', 'bg-primary-container');
    dots[currentSlide].classList.add('w-1.5', 'bg-surface-container-highest');

    currentSlide = index;
    slides[currentSlide].classList.remove('hidden');
    dots[currentSlide].classList.remove('w-1.5', 'bg-surface-container-highest');
    dots[currentSlide].classList.add('w-5', 'bg-primary-container');
  }

  // Auto rotate carousel subtly every 6 seconds
  setInterval(() => {
    const next = (currentSlide + 1) % slides.length;
    goToSlide(next);
  }, 6000);

  function togglePassword() {
    const pwdInput = document.getElementById('password');
    const eyeIcon = document.getElementById('eyeIcon');
    if (!pwdInput || !eyeIcon) return;

    if (pwdInput.type === 'password') {
      pwdInput.type = 'text';
      eyeIcon.textContent = 'visibility';
    } else {
      pwdInput.type = 'password';
      eyeIcon.textContent = 'visibility_off';
    }
  }
</script></main>
