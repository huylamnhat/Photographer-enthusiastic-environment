<div class="w-full flex items-center justify-center py-margin-lg px-gutter">
<div class="w-full max-w-[520px] bg-surface-container-lowest rounded-xl shadow-xl flex flex-col overflow-hidden relative">
<!-- Top Subtle Indicator Strip -->
<div class="w-full h-1 bg-gradient-to-r from-primary-container via-primary to-secondary"></div>
<!-- Header & Brand Identification -->
<div class="p-gutter-lg pb-0 flex flex-col items-center text-center">
<!-- Logo Stamp & Badge Row -->
<div class="flex items-center gap-space-sm mb-space-md">
<div class="flex items-center gap-space-2xs bg-surface-container px-space-sm py-space-2xs rounded-lg">
<span class="material-symbols-outlined text-primary text-[1.125rem]" style="font-variation-settings: 'FILL' 1;">camera_roll</span>
<span class="font-headline-sm text-headline-sm uppercase tracking-wider text-on-surface">MINILAB ARCHIVE</span>
</div>
<span class="bg-surface-variant text-on-surface-variant font-label-sm text-label-sm px-space-xs py-space-2xs rounded uppercase tracking-wider">
            LAB OPS / PHÂN HỆ TIỆM LAB
          </span>
</div>
<h1 class="font-headline-xl text-headline-xl text-on-surface tracking-tight mb-space-2xs">Đăng nhập Film Lab</h1>
<p class="font-body-sm text-body-sm text-on-surface-variant max-w-sm">
          Hệ thống quản lý tiếp nhận &amp; xử lý cuộn phim analog chuẩn hóa
        </p>
</div>
<!-- Main Operational Form Card -->
<form class="p-gutter-lg pt-space-lg flex flex-col gap-space-md" id="lab-login-form" onsubmit="event.preventDefault(); handleShiftLogin();">
<!-- Operator ID / Email Field -->
<div class="flex flex-col gap-space-2xs text-left"><label class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-wider" for="operator-id">Email / Mã tài khoản tiệm</label><div class="relative flex items-center"><span class="material-symbols-outlined absolute left-space-sm text-on-surface-variant text-[1.125rem]">mail</span><input class="w-full bg-surface-container-lowest text-on-surface font-body-md text-body-md pl-10 pr-space-md py-space-sm rounded-lg focus:outline-none focus:ring-1 focus:ring-primary shadow-sm" id="operator-id" placeholder="lab@saigonfilm.vn hoặc LAB-01" required="" type="text" value="lab@saigonfilm.vn"></div></div>
<!-- Secure Password Input -->
<div class="flex flex-col gap-space-2xs text-left">
<div class="flex justify-between items-center">
<label class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-wider" for="operator-password">
              MẬT KHẨU BẢO MẬT
            </label>
<a class="font-label-sm text-label-sm text-primary hover:underline" href="javascript:void(0)">
              Quên mật khẩu?
            </a>
</div>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-space-sm text-on-surface-variant text-[1.125rem]">lock</span>
<input class="w-full bg-surface-container-lowest text-on-surface font-code-md text-code-md pl-10 pr-10 py-space-sm rounded-lg focus:outline-none focus:ring-1 focus:ring-primary shadow-sm" id="operator-password" placeholder="••••••••••••" required="" type="password" value="LabArchive@2024">
<button class="absolute right-space-sm text-on-surface-variant hover:text-on-surface flex items-center justify-center p-space-2xs rounded focus:outline-none" id="toggle-pwd-btn" onclick="togglePasswordVisibility()" title="Hiện/Ẩn mật khẩu" type="button">
<span class="material-symbols-outlined text-[1.125rem]" id="pwd-icon">visibility_off</span>
</button>
</div>
</div>
<!-- Branch Selector -->
<div class="flex flex-col gap-space-2xs text-left">
<label class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-wider" for="lab-branch">Chi nhánh tiệm</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-space-sm text-on-surface-variant text-[1.125rem]">storefront</span>
<select class="w-full bg-surface-container-lowest text-on-surface font-body-sm text-body-sm pl-10 pr-10 py-space-sm rounded-lg appearance-none focus:outline-none focus:ring-1 focus:ring-primary shadow-sm cursor-pointer" id="lab-branch">
<option selected="" value="sgn-01">Chi nhánh 01 - Quận 3, TP.HCM (Lab Trung Tâm)</option>
<option value="sgn-02">Chi nhánh 02 - Thảo Điền, TP.Thủ Đức (Lab Scan Tốc Độ)</option>
<option value="han-01">Chi nhánh 03 - Hoàn Kiếm, Hà Nội (Trạm Nhận)</option>
</select>
<span class="material-symbols-outlined pointer-events-none absolute right-space-sm text-on-surface-variant text-[1.125rem]">expand_more</span>
</div>
</div>
<!-- Shift Role Selector Indicator -->

<!-- Telemetry/Station Status Summary Row -->

<!-- Primary Action Trigger -->
<button class="w-full bg-primary-container hover:bg-primary text-on-primary py-space-sm px-space-md rounded-lg font-headline-md text-headline-md flex items-center justify-center gap-space-sm shadow-md transition-all active:scale-[0.99] cursor-pointer mt-space-2xs" id="btn-submit" type="submit"><span class="material-symbols-outlined text-[1.25rem]">login</span><span class="">Đăng nhập</span></button>
</form>
<!-- Bottom System Footer & Register Prompt -->
<div class="bg-surface-container p-gutter-lg pt-space-md flex flex-col gap-space-sm text-center"><div class="flex items-center justify-center gap-space-xs font-body-sm text-body-sm text-on-surface-variant"><span class="">Chưa có tài khoản tiệm?</span><a class="font-headline-sm text-primary hover:underline flex items-center gap-space-2xs" href="javascript:void(0)">Đăng ký mở tiệm Lab<span class="material-symbols-outlined text-[0.875rem]">arrow_forward</span></a></div></div>
</div>
</div>
</div>
<script>
  function togglePasswordVisibility() {
    const passwordInput = document.getElementById('operator-password');
    const pwdIcon = document.getElementById('pwd-icon');
    if (passwordInput.type === 'password') {
      passwordInput.type = 'text';
      pwdIcon.textContent = 'visibility';
    } else {
      passwordInput.type = 'password';
      pwdIcon.textContent = 'visibility_off';
    }
  }

  function selectRole(role) {
    document.getElementById('selected-role').value = role;
    const roles = ['owner', 'manager', 'operator'];
    roles.forEach(r => {
      const btn = document.getElementById('role-btn-' + r);
      if (r === role) {
        btn.className = 'role-choice py-space-xs px-space-xs rounded font-headline-sm text-label-sm flex flex-col items-center justify-center gap-space-2xs bg-surface-container-lowest text-primary shadow-sm transition-all';
      } else {
        btn.className = 'role-choice py-space-xs px-space-xs rounded font-headline-sm text-label-sm flex flex-col items-center justify-center gap-space-2xs text-on-surface-variant hover:text-on-surface transition-all';
      }
    });
  }

  function handleShiftLogin() {
    const submitBtn = document.getElementById('btn-submit');
    const originalContent = submitBtn.innerHTML;
    submitBtn.innerHTML = `
      <span class="material-symbols-outlined animate-spin text-[1.25rem]">sync</span>
      <span>Đang kích hoạt trạm làm việc...</span>
    `;
    submitBtn.disabled = true;

    setTimeout(() => {
      submitBtn.innerHTML = `
        <span class="material-symbols-outlined text-[1.25rem]">check_circle</span>
        <span>Đã kết nối thành công!</span>
      `;
      submitBtn.classList.remove('bg-primary-container');
      submitBtn.classList.add('bg-secondary');
    }, 900);
  }
</script></main>

</body></html>
